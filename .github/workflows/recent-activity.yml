# Recent activity block — jamesgeorge007/github-activity-readme rewrites the section
# between the START/END activity markers in README.md. Run once to populate it.
name: Update recent activity

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activity readme
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          MAX_LINES: 10
          TARGET_FILE: "README.md"
          FILTER_EVENTS: "PushEvent,CreateEvent,PullRequestEvent,IssueCommentEvent,IssuesEvent,ReleaseEvent,ForkEvent,WatchEvent"
          COMMIT_MSG: "chore: update recent activity section"
