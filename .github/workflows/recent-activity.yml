# Recent activity block — scripts/update_activity.py pulls Abhinav1480's live
# public event feed and rewrites the section between the START/END activity
# markers in README.md. Runs daily or on demand.
name: Update recent activity

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch events and rewrite the activity section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_activity.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update recent activity section" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            echo "push failed (attempt $i), retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          exit 1
