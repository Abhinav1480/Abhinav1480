name: Generate contribution snake

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#FF4D30&color_dots=#2A2A33,#FF718A,#FF8A45,#FFC857,#F5F5F5
            assets/github-snake.svg?color_snake=#FF4D30&color_dots=#E8EAF0,#FF8A45,#FFC857,#5B8DEF,#43C9B7

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          git commit -m "chore: regenerate contribution snake" || echo "nothing to commit"
          git push
