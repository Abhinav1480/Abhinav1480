  <text x="34" y="54" font-family="'ui-monospace', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#FF4D30">01</text>
  <text x="34" y="94" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0.5" fill="#F5F5F5">ExamOS</text>
  <rect x="34" y="106" width="34" height="3" rx="1.5" fill="#FF4D30"/>

  <rect x="603" y="42" width="143" height="24" rx="12" fill="#1B1B26" stroke="#333340" stroke-width="1"/>
  <text x="674.5" y="58" text-anchor="middle" font-family="'ui-monospace', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11"
