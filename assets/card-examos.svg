  <text x="34" y="142" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9298AA">Study productivity platform centralizing PDFs, notes and timetables,</text><text x="34" y="166" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9298AA">with a built-in PDF viewer and Pomodoro timer.</text>

